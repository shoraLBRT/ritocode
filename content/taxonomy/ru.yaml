classes:
  disproportion:
    name: Несоразмерность
    description: Решение не по масштабу задачи — больше или меньше, чем нужно.
  project-knowledge:
    name: Незнание проекта
    description: Агент не знал, что уже есть в проекте, и сделал своё.
  hygiene:
    name: Гигиена и безопасность
    description: То, что должно быть закрыто оградой, а не внимательностью.
  growth:
    name: Разрастание
    description: Агент дописывает и почти никогда не перестраивает.
  false-confidence:
    name: Ложная уверенность
    description: Всё выглядит проверенным, но на деле ничего не проверено.
  domain:
    name: Предметная область
    description: Агент не знал правил предметной области, и ему их не сказали.

treatments:
  brief:
    name: Постановка задачи агенту
    leaves:
      scale: масштаб — сколько пользователей и данных
      lifetime: срок жизни и кто будет поддерживать
      scope: границы — что не трогать и чего не добавлять
      requirements: обязательные свойства — безопасность, точность, совместимость
      reuse: использовать то, что уже есть в проекте
  rule:
    name: Правило в репозитории
    leaves:
      structure: структура и границы слоёв
      limits: пределы размера и сложности
      conventions: обязательные механизмы — ошибки, логи, конфигурация, секреты
      forbidden: запрещённые API и зависимости
      tests: требования к тестам
  auto:
    name: Автоматическая проверка
    leaves:
      linter: линтер или статический анализатор
      types: проверка типов
      secrets: сканер секретов
      metrics: порог размера и сложности в CI
      dependencies: проверка зависимостей
      architecture: архитектурный тест
      test-quality: проверка качества тестов — покрытие, мутации
  manual:
    name: Исправить руками сейчас
    leaves:
      split: разделить по ответственности
      dedupe: убрать дублирование
      extract-config: вынести значения в конфигурацию
      handle-errors: обработать ошибки явно
      validate: добавить проверку входных данных и прав
      representation: исправить представление данных — деньги, время, идентификаторы
      invariant: защитить инвариант
      remove: удалить лишнее — мёртвый код, слой, зависимость
      tests: написать или исправить тесты
  accept:
    name: Оставить осознанно
    leaves:
      fits-context: в этом контексте это нормально
      not-worth-it: исправление дороже проблемы
      debt: записать как долг с условием пересмотра
