# Local development dependencies for Ritocode.
#
# Start with: docker compose up -d   (or scripts/dev-up.sh / scripts/dev-up.ps1, which also
# waits for health and applies migrations).
#
# Nothing here is production configuration. Credentials are fixed and weak on purpose: these
# containers must never be exposed beyond localhost.

name: ritocode

services:
  postgres:
    image: postgres:17-alpine
    container_name: ritocode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ritocode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ritocode}
      POSTGRES_DB: ${POSTGRES_DB:-ritocode}
      # Deterministic collation, so ORDER BY on text behaves identically on every machine
      # and in CI. Sorting differences between locales would otherwise show up as flaky
      # pagination tests.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      # Non-default host ports: a developer machine very often already has PostgreSQL
      # on 5432, and "one command to start" must not depend on that being free.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ritocode} -d ${POSTGRES_DB:-ritocode}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Object storage for problem bundles, workspace snapshots and evaluation artifacts,
  # per docs/ARCHITECTURE.md. S3-compatible, so production can swap in a managed service
  # without touching application code.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ritocode-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ritocode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ritocode-dev-secret}
    ports:
      - "${MINIO_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the buckets the platform expects, then exits. Bucket creation is idempotent, so
  # running it again is harmless. Note that `docker compose up --wait` treats a container that
  # exits as a failure, so scripts wait on postgres and minio and run this one separately.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ritocode-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ritocode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ritocode-dev-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/problem-bundles &&
      mc mb --ignore-existing local/workspace-snapshots &&
      mc mb --ignore-existing local/evaluation-artifacts &&
      echo 'buckets ready'
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
