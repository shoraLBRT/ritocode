name: End-to-end

# The learning flow in a browser (#39, e2e/): signed out, solve, Check, sign in with a fake GitHub,
# review, progress — against the compose PostgreSQL, the API and the production build of the pages.
# On every pull request and every push to main, like the other checks: the run takes a few minutes, and
# a break found nightly would already be merged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  learning-flow:
    name: Learning flow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Start PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres

      # Built once here, so the run's `dotnet run`s start without compiling.
      - name: Build the API and the migrator
        run: |
          dotnet build src/Ritocode.Api
          dotnet build src/Ritocode.DbMigrator

      - name: Install the pages' and the test's packages
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Cache Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run
        working-directory: e2e
        run: npm test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
