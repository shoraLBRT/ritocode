name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No database service here. Tests that need PostgreSQL start their own container through
    # Testcontainers and take a database per test class from it, so a shared service container
    # would only be a second, less isolated database sitting unused. Docker is preinstalled on
    # GitHub-hosted runners.

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Ritocode.slnx

      # Warnings are errors via Directory.Build.props, so this also fails on newly
      # disclosed vulnerabilities in transitive packages (NU1903).
      - name: Build
        run: dotnet build Ritocode.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Ritocode.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results
          retention-days: 7

  verify-formatting:
    name: Verify formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Style rules come from .editorconfig; this fails the build on unformatted code
      # rather than leaving it to review comments.
      - name: Check formatting
        run: dotnet format Ritocode.slnx --verify-no-changes --verbosity diagnostic

  database:
    name: Migrations and schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ritocode
          POSTGRES_PASSWORD: ritocode
          POSTGRES_DB: ritocode
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ritocode -d ritocode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      Database__ConnectionString: "Host=localhost;Port=5432;Database=ritocode;Username=ritocode;Password=ritocode"

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      # The service container is a fresh database on every run, so this is the
      # "migrations run from an empty DB" guarantee, checked rather than assumed.
      - name: Apply migrations to an empty database
        run: dotnet run --project src/Ritocode.DbMigrator

      # Exit code 2 means pending migrations. Immediately after applying them there must be none;
      # anything else means a migration did not actually take effect.
      - name: Verify nothing is left pending
        run: dotnet run --project src/Ritocode.DbMigrator -- status

      # Fails when a module's EF model no longer matches its last migration — the schema-drift
      # check #4 asks for.
      - name: Verify no model drift
        run: ./scripts/db-verify-no-drift.sh
